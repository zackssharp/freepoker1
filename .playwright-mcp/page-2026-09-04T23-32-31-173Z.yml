        - generic [ref=f1e23]:
          - generic [ref=f1e24]:
            - paragraph [ref=f1e25]: Texas Holdem Poker is among the world’s most popular card games. That’s because it involves luck, subterfuge, and guile to win, elegantly combining strategy with chance. The fact that players never know how a round will end makes the game even more alluring. No wonder millions of people play the game every day!
            - paragraph [ref=f1e26]: The following guide teaches you to play Texas Holdem Poker step-by-step. You’ll learn the basics, plus extra tactics you can deploy to improve your chances of winning.
          - generic [ref=f1e27]:
            - heading "Step-By-Step Texas Holdem Poker Guide" [level=2] [ref=f1e28]
            - paragraph [ref=f1e29]: Texas Holdem Poker isn’t a game you can pick up in five minutes. That’s because there’s a lot to learn. You need to understand the betting structure, hand rankings, and order of play.
            - paragraph [ref=f1e30]: With that said, it should come naturally once you get the hang of it. Each round follows a similar pattern. The most challenging aspect of getting started is remembering the five-card hand rankings. The rest is pretty straightforward.
            - paragraph [ref=f1e31]: This section explains the elements of the game and how they contribute to your overall strategy. Learning the basics will enable you to get started, but as you keep running through rounds, you’ll naturally discover new tactics (within the rules) to outfox your opponents.
          - generic [ref=f1e32]:
            - heading "The Betting Structure" [level=3] [ref=f1e33]
            - paragraph [ref=f1e34]: Betting is at the heart of Texas Holdem Poker. Players place chips on the table when they believe they may win a hand (or want to bluff an opponent into giving up on that particular round).
            - paragraph [ref=f1e35]: "Texas Holdem Poker has four betting rounds. (We will explain how they fit together later. For now, focus on understanding what they mean). Here’s what you need to know:"
            - paragraph [ref=f1e36]:
              - strong [ref=f1e37]: 1. Pre-flop
            - paragraph [ref=f1e38]:
              - img "poker preflop" [ref=f1e39]
            - paragraph [ref=f1e40]: By tradition, the first betting round in Texas Holdem Poker is the pre-flop. Here, players place bets before the dealer deals cards.
            - paragraph [ref=f1e41]: Options include fold, call, and raise. Folding means players voluntarily eliminate themselves from the round before seeing more cards. Players might decide on this option if they believe they have a poor hand (or another player has a good one).
            - paragraph [ref=f1e42]: “Call” means that players match the existing bet for the round. “Raise” means that players add to the current wager.
            - paragraph [ref=f1e43]: The first player to the dealer’s left is the “small blind,” and the second is the “big blind.” Texas Holdem Poker uses the “blind” terminology to emphasize that these players must place bets without seeing any cards.
            - paragraph [ref=f1e44]: Texas Holdem Poker requires the “small blind” to place half the small bet limit at the table. The “big blind” must place a bet equal to this limit.
            - paragraph [ref=f1e45]: Players decide on the limits before the game begins. When betting at a casino, the house might decide what this betting limit is.
            - paragraph [ref=f1e46]:
              - strong [ref=f1e47]: 2. Flop
            - paragraph [ref=f1e48]:
              - img "poker flop" [ref=f1e49]
            - paragraph [ref=f1e50]: The “flop” refers to the first three community cards the dealer lays face-up on the table, taken from the top of the freshly shuffled pack and cut pack. Players compare the cards in their hands to those on the table to see if they can make good hands from them.
            - paragraph [ref=f1e51]: Following that is another round of betting where players can fold, call (check), or raise using chips or cash. If players believe they have a good hand or other players have bad ones, they may decide to raise their bets. Other players can then call or raise further.
            - paragraph [ref=f1e52]: If players believe they have a bad hand, they can fold and cut their losses. Players who fold must relinquish all chips bet in that round.
            - paragraph [ref=f1e53]:
              - strong [ref=f1e54]: 3. Turn
            - paragraph [ref=f1e55]:
              - img "poker turn" [ref=f1e56]
            - paragraph [ref=f1e57]: Texas Holdem Poker calls the fourth dealt community card the “turn.” Here, the dealer places another card from the pack beside the flop.
            - paragraph [ref=f1e58]: The additional card provides more opportunities for players to construct five-card winning hands. Players can attempt to make straights, flushes, and other combinations.
            - paragraph [ref=f1e59]: "Once the turn occurs, players engage in another round of betting. The options are the same as in previous betting rounds: players can fold, call, or raise, starting with the “small blind” and moving left from the dealer’s position."
            - paragraph [ref=f1e60]: Again, players must weigh up whether to continue placing bets or fold. At this stage, players will also try to assess the behavior of other players to determine the quality of their hands, calling or raising to pressure opponents to fold or increase the stakes.
            - paragraph [ref=f1e61]:
              - strong [ref=f1e62]: 4. River
            - paragraph [ref=f1e63]:
              - img "poker river" [ref=f1e64]
            - paragraph [ref=f1e65]: The fifth and final community card is the river. Dealers place this face up in the center of the table next to the other cards already presented.
            - paragraph [ref=f1e66]: Adding the final community card gives players another opportunity to create winning hands. Again, they can fold, call (check), or raise, depending on their perceived chances of winning the round.
            - paragraph [ref=f1e67]: In some cases, players may decide to go all-in. In other cases, one player may raise, and no one else will call, leading to the end of the round before any player reveals their cards.
          - generic [ref=f1e68]:
            - heading "Hand Rankings" [level=2] [ref=f1e69]
            - paragraph [ref=f1e70]:
              - text: In Texas Holdem
              - link "Poker" [ref=f1e71] [cursor=pointer]:
                - /url: ./
              - text: ", players aim to construct the highest-ranking five-card sets from the five community cards and the two cards the dealer deals to each player at the start of the round."
            - paragraph [ref=f1e72]: The game ranks hands based on the rough probability of them occurring. Higher ranks are less probable but mean players who construct them are significantly more likely to win a round.
            - paragraph [ref=f1e73]: "Here are the rankings from highest to lowest:"
            - list [ref=f1e74]:
              - listitem [ref=f1e75]:
                - strong [ref=f1e76]: Royal flush
